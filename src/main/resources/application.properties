spring.application.name=backpetique

#Para poder correr el local el proyecto se debe copiar este archivo y nombrarlo
#"application-local-properties" y ahi ponemos nuestras credenciales como el nombre de la base de datos
#el usuario con su contraseña, cambiar el product_ddl por update, por ultimo
#descomentamos la linea spring.profiles.active para que apunte
#a ese arhivo y se pueda correr de manera local sin exponer nuestras credenciales y gitignore tomara
#en cuenta ese archivo local y no se subira ese archivo
#spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#create-drop solo recomendada para desarrollo
spring.jpa.hibernate.ddl-auto=${PRODUCT_DDL}
#create-drop

#para visualizar las consultas sql que se realizan
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true